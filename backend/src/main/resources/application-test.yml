spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:skillswap_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

rate:
  limit:
    enabled: false

logging:
  level:
    root: WARN
    com.skillswap: INFO
