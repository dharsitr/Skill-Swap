spring:
  application:
    name: SkillSwap API
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DATABASE_USERNAME:postgres.akrsiounrqwebmdkkoqs}
    password: ${DATABASE_PASSWORD:Dharsit@12345}

    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never

app:
  version: ${APP_VERSION:0.1.0}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

supabase:
  url: ${SUPABASE_URL:https://akrsiounrqwebmdkkoqs.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:}
    verify-signature: ${SUPABASE_JWT_VERIFY_SIGNATURE:false}

rate:
  limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:180}
    mutation-per-minute: ${RATE_LIMIT_MUTATION_PER_MINUTE:60}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.skillswap: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
