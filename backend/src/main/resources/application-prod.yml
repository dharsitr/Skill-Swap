spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

rate:
  limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    mutation-per-minute: ${RATE_LIMIT_MUTATION_PER_MINUTE:40}

logging:
  level:
    root: WARN
    com.skillswap: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.flywaydb: INFO
