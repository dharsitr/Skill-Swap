name: SkillSwap CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop, "staging/**", "release/**" ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Frontend Quality Gate & Build
  # ============================================================================
  frontend-ci:
    name: Frontend CI (Typecheck, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Unit & Component Tests (Vitest)
        run: npm run test

      - name: Build Production Frontend Bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.skillswap.example.com/api/v1' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'dummy-anon-key' }}

  # ============================================================================
  # 2. Backend Quality Gate & Package
  # ============================================================================
  backend-ci:
    name: Backend CI (Unit/Integration Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Test Suite (Surefire / JUnit 5)
        run: ./mvnw test

      - name: Package Backend Application JAR
        run: ./mvnw package -DskipTests

  # ============================================================================
  # 3. Security & Dependency Audit
  # ============================================================================
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependency Security Audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
